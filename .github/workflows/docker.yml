# 推送到 main 或打 tag(如 v1.0.0)时,自动构建 Docker 镜像并同时推送到:
#   - Docker Hub:      brian9909/class-schuedule
#   - GitHub Container Registry: ghcr.io/brian099/class-schedule
# 两处都推:compose 默认拉 Docker Hub,GHCR 作为备用源,改名/换源都不影响老用户。
# 推送成功后,再把仓库 README.md 同步到 Docker Hub 仓库介绍(Overview)。
#
# 用户拉取:
#   docker pull brian9909/class-schuedule:latest
#   docker pull ghcr.io/brian099/class-schedule:latest
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置:
#   DOCKERHUB_USERNAME  Docker Hub 用户名(brian9909)
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌(Access Token,不是登录密码)
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  # 也允许在 Actions 页手动触发一次
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU 提供跨架构模拟,arm64 就是靠它在 amd64 runner 上跑出来的
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像 tag:
      #   推 main          → latest
      #   tag v1.2.3       → 1.2.3 + 1.2 + latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR 名固定成 class-schedule,不用 ${{ github.repository }},
          # 这样 GitHub 仓库名和镜像名可以各自独立(比如仓库改名不影响镜像地址)
          images: |
            ghcr.io/brian099/class-schedule
            brian9909/class-schuedule
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # 覆盖大多数场景:x86_64 服务器 + ARM(树莓派/M1/M2 Mac)
          # arm64 通过 QEMU 模拟构建极慢且 npm ci 会撞 illegal instruction,
          # 先只发 amd64。要 arm64 时用 ubuntu-24.04-arm 原生 runner 拆两个 job。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 让下次构建复用缓存,加速
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把仓库根 README.md 同步到 Docker Hub 仓库介绍(Overview),
      # 保证镜像页文档与仓库一致;复用上面同一组 Docker Hub 凭据
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: brian9909/class-schuedule
          short-description: 课程表 + 天气 + 备忘 + 展示看板,家校一体化应用(React + 零依赖 Node)
          readme-filepath: ./README.md
